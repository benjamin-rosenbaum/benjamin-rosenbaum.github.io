project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    # Repo documentation, not site pages. Without these exclusions Quarto renders
    # them into stray HTML pages and lists them in sitemap.xml.
    - "!README.md"
    - "!LICENSE-CONTENT.md"
    - "!NOTES.md"
  resources:
    # Referenced only from styles.css, so Quarto can't discover it on its own.
    - ORCID-iD_icon_BW_vector.svg

website:
  title: "Benjamin Rosenbaum"
  description: "Academic homepage of Benjamin Rosenbaum — research, courses, and software."
  site-url: "https://benjamin-rosenbaum.github.io"
  # Link preview cards on Bluesky, LinkedIn, Slack, Mastodon etc. Both need
  # site-url set above — without it the image path can't be made absolute, and
  # scrapers ignore relative ones.
  open-graph: true
  twitter-card:
    # "summary" is the small square card, which suits a square headshot.
    # summary_large_image needs a wide ~1200x630 image; feeding it a square one
    # gets it centre-cropped, which lops the top and bottom off a face.
    card-style: summary
  image: profile_rosenbaum.jpg
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: work.qmd
        text: Work
      - href: courses.qmd
        text: Courses
      - href: software.qmd
        text: Software 
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:benjamin.rosenbaum@idiv.de
        aria-label: Email
  page-footer:
    left: "© 2026 Benjamin Rosenbaum"
    right: "Built with [Quarto](https://quarto.org)"
  reader-mode: false

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      body-width: 900px

execute:
  freeze: auto
